<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jitsu Wales Events</title>

<style>
:root {
  --accent: #b91c1c;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.hero {
  position: relative;
  height: 50vh;
  min-height: 320px;
  background: url('image.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.5);
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero h1 {
  font-size: 2.5rem;
  margin: 0;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

.lead {
  font-size: 1.1rem;
  max-width: 700px;
  margin: 0 auto 30px;
  text-align: center;
}

.grid {
  display: grid;
  gap: 24px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.card {
  background: var(--card);
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.08);
  padding: 20px;
}

.card h2 {
  margin-top: 0;
}

iframe {
  width: 100%;
  height: 360px;
  border: 0;
  border-radius: 10px;
}

.links {
  text-align: center;
  margin-top: 30px;
}

.links a {
  display: inline-block;
  margin: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  text-decoration: none;
  background: var(--accent);
  color: white;
  font-weight: 500;
}

footer {
  text-align: center;
  font-size: .9rem;
  padding: 30px 20px;
  opacity: .7;
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">
    <h1>Jitsu Wales Events</h1>
  </div>
</section>

<div class="container">

  <p class="lead">
    Friendly, structured classes focused on practical self-defence, fitness,
    and progression. Beginners always welcome.
  </p>

  <!-- EMBEDS -->
  <div class="grid" style="margin-top: 24px; margin-bottom: 24px;">

    <div class="card">
      <h2>Regional and National Events</h2>
      <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Europe%2FLondon&showPrint=0&title=Regional%20and%20National%20Events&hl=en_GB&showTz=0&showCalendars=0&showTabs=0&src=766442830e817b47c1289e94e244f37a15a7c47dc14ef3270029bfea733f134f&color=%23cc003c&color=%238E24AA"></iframe>
    </div>

  </div>
  
  <!-- CONTACT / SOCIAL -->
  <div class="links">
    <a href="mailto:cardiffjitsuclub@gmail.com?subject=Jiu Jitsu enquiry">Email</a>
    <a href="https://www.facebook.com/cardiffjitsu" target="_blank">Facebook</a>
    <a href="https://www.instagram.com/cardiffjitsu/" target="_blank">Instagram</a>
  </div>

</div>

<footer>
  <a href="https://www.jitsufoundation.org" target="_blank">The Jiu Jitsu Foundation</a>
</footer>

</body>
</html>
